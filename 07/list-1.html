<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>불릿과 번호 바꾸기</title>
  <style>
    /* Do it! 목록의 불릿과 번호 바꾸기 */
    .decimal-list {
      list-style-type: decimal; /* 번호로 변경 */
    }
    .disc-list {
      list-style-type: disc; /* 불릿으로 변경 */
    }
    .circle-list {
      list-style-type: circle; /* 원형 불릿으로 변경 */
    }
    .square-list {
      list-style-type: square; /* 사각형 불릿으로 변경 */
    }
    .decimal-leading-zero-list {
      list-style-type: decimal-leading-zero; /* 앞에 0이 붙은 번호로 변경 */
    }
    .lower-roman-list {
      list-style-type: lower-roman; /* 소문자 로마 숫자로 변경 */
    }
    .upper-roman-list {
      list-style-type: upper-roman; /* 대문자 로마 숫자로 변경 */
    }
    .lower-alpha-list {
      list-style-type: lower-alpha; /* 소문자 알파벳으로 변경 */
    }
    .upper-alpha-list {
      list-style-type: upper-alpha; /* 대문자 알파벳으로 변경 */
    }
    .none-list {
      list-style-type: none; /* 불릿과 번호 제거 */
    }

  </style>
</head>
<body>
  <h1>도서 시리즈</h1>
  <ul class="lower-roman-list">
    <li>Do it! 시리즈</li>
    <li>된다 시리즈</li>
    <li>DCM 프로 사진가</li>
    <li>데이터과학 시리즈</li>
  </ul>

  <ol class="upper-alpha-list">
    <li>Do it! 시리즈</li>
    <li>된다 시리즈</li>
    <li>DCM 프로 사진가</li>
    <li>데이터과학 시리즈</li>
  </ol>
</body>
</html>
