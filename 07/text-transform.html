<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>text-transform</title>
  <style>    
  /* Do it! 영문자의 대소문자 변환하기 */
  .capitalize {
    text-transform: capitalize; /* 각 단어의 첫 글자를 대문자로 변환 */
  }
  .uppercase {
    text-transform: uppercase; /* 모든 글자를 대문자로 변환 */
  }
  .lowercase {
    text-transform: lowercase; /* 모든 글자를 소문자로 변환 */
  }
  .full-width {
    text-transform: full-width; /* 영문자를 전각 문자로 변환 */
  }
  </style>
</head>
<body>
  <p class="capitalize">html</p> 
  <p class="uppercase">css</p>
  <p class="lowercase">JAVASCRIPT</p>
  <p class="full-width">Full-width</p>
</body>
</html>
