<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>text-shadow</title>
  <style>    
    h1 { 
      font-size:60px;
    } 
    /* Do it! text-shadow 속성으로 텍스트 그림자 추가하기 */
    .shadow1 {
      text-shadow: 1px 1px black;
    }
    .shadow2 {
      text-shadow: 5px 5px 3px #ffa500;
    }
    .shadow3 {
      text-shadow: 7px -7px 20px #000;
    }
    .shadow4 {
      text-shadow: 2px 2px 15px rgb(0, 255, 42) , -2px -2px 15px rgb(255, 0, 242);
    }
  </style>
</head>
<body>
  <h1 class="shadow1">가로, 세로, 색상</h1> 
  <h1 class="shadow2">가로, 세로, 번짐, 색상</h1>
  <h1 class="shadow3">가로, 세로, 번짐, 색상2</h1>
  <h1 class="shadow4">가로, 세로, 번짐, 색상 2개 섞기</h1>
</body>
</html>
