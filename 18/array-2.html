<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<title>Array 객체의 메서드</title>
	<style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
			font-size: 1.2em;
    }
		hr {
			width: 100%;			
		}
	</style>
</head>
<body>
	<div class="container">
		<script>
			// Do it! Array 객체의 다양한 메서드 연습하기
	
			let nums = [1, 2, 3];
			let chars = ["a", "b", "c", "d"];
			document.write(`length: ${nums.length} | Array: ${nums}<br>`);
			document.write(`length: ${chars.length} | Array: ${chars}<br>`);
			document.write(`<hr>`);
			// 두 개의 배열 합치기
			let numsChars = nums.concat(chars);
			let charsNums = chars.concat(nums);
			document.write(`numsChars: ${numsChars}, <br> charsNums : ${charsNums}`);
			document.write(`<hr>`);
	
			// 배열 안의 요소 합치기
			let string1 = nums.join();
			document.write(`string1 : ${string1}<br>`);
			let string2 = chars.join('/');
			document.write(`string2 : ${string2}`);
			document.write(`<hr>`);
			// 요소 추가 - 새로운 length 값 반환
			let ret1 = nums.push(4,5);
			document.write(`push(4,5) -> length: ${ret1} | Array: ${nums}<br>`);
			let ret2 = nums.unshift(0);
			document.write(`unshift(0) -> length: ${ret2} | Array: ${nums}<br>`);
			document.write(`<hr>`);
			// 요소 추출 - 꺼낸 요소 반환
			let popped1 = chars.pop();
			document.write(`pop: ${popped1} | Array: ${chars}<br>`);
			let popped2 = chars.shift();
			document.write(`shift: ${popped2} | Array: ${chars}<br>`);
			document.write(`<hr>`);	
		</script>
	</div>
</body>
</html>
