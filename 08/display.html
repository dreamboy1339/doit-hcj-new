<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>CSS display 속성</title>
  <style>
    /* Do it! li 요소를 가로로 나란히 배치하기 */
    nav > ul {
      list-style:none;      
    }
    nav ul li {
      display: inline-block; /* inline-block 속성 적용 */
      width: 100px; /* 너비 지정 */
      height: 40px; /* 높이 지정 */
      line-height: 40px; /* 수직 가운데 정렬 */
      text-align: center; /* 가로 가운데 정렬 */
      margin: 10px; /* 바깥 여백 */
      border: 1px solid #222; /* 테두리 */
      background-color: #eee; /* 배경색 */
    }
    a {
      text-decoration: none;
    }
  </style>
</head>
<body>
   <nav>
     <ul>
      <li><a href="#">메뉴 1</a></li>
      <li><a href="#">메뉴 2</a></li>
      <li><a href="#">메뉴 3</a></li>
      <li><a href="#">메뉴 4</a></li>
     </ul>
   </nav>
</body>
</html>
