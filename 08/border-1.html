<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<title>박스모델</title>
	<style>
		div {
			width:200px;
			height:100px;
			display:inline-block;
			margin:15px;	
			text-align: center;
			font-size:20px;
			line-height:100px;		
			border-width:5px;  /* 테두리 굵기 */
		}
		/* Do it! 테두리 스타일 지정하기 */
		.border-solid {
			border-style: solid;  /* 실선 테두리 */
			border-color: blue;   /* 테두리 색상 */
		}
		.border-dotted {
			border-style: dotted; /* 점선 테두리 */
			border-color: red;    /* 테두리 색상 */
		}
		.border-dashed {
			border-style: dashed; /* 점선 테두리 */
			border-color: green;  /* 테두리 색상 */
		}
		.border-double {
			border-style: double; /* 이중선 테두리 */
			border-color: orange; /* 테두리 색상 */
		}
		.border-groove {
			border-style: groove; /* 입체감 있는 테두리 */
			border-color: purple; /* 테두리 색상 */
		}
		.border-inset {
			border-style: inset;  /* 안쪽으로 들어간 테두리 */
			border-color: brown;  /* 테두리 색상 */
		}
		.border-outset {
			border-style: outset; /* 바깥쪽으로 나온 테두리 */
			border-color: pink;   /* 테두리 색상 */
		}
		.border-ridge {
			border-style: ridge;  /* 돌출된 테두리 */
			border-color: greenyellow;   /* 테두리 색상 */
		}
	</style>
</head>
<body>
	<div class="border-solid">실선 테두리 </div>
	<div class="border-dotted">점선 테두리 </div>
	<div class="border-dashed">점선 테두리</div>
	<div class="border-double">이중선 테두리</div>
	<div class="border-groove">입체감 있는 테두리</div>
	<div class="border-inset">안쪽으로 들어간 테두리</div>
	<div class="border-outset">바깥쪽으로 나온 테두리</div
	<div class="border-ridge">돌출된 테두리</div>
</body>
</html>
