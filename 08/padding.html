<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>박스 모델 - 패딩</title>
  <style>
		h1 {
			display:inline-block;
			border:1px solid #000;
		}
		/* Do it! 박스 모델에 패딩 지정하기 */
		#padding1 {
			padding: 20px;
		}
		#padding2 {
			padding-top: 20px;
			padding-right: 40px;
			padding-bottom: 60px;
			padding-left: 80px;
		}
		#padding3 {
			padding: 20px 40px 60px 80px;
		}
  </style>
</head>
<body>
    <h1>레드향</h1>
		<h1 id="padding1">레드향</h1>
		<h1 id="padding2">레드향</h1>
		<h1 id="padding3">레드향</h1>
</body>
</html>
