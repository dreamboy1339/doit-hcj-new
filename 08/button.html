<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>박스 모델</title>
  <style>
    /* Do it! 박스 모델에 버튼 스타일 지정하기 */
    button {
      padding: 10px 20px;
      margin: 10px;
      border: 1px solid #ccc;
      border-radius: 25px;
    }

    button:hover {
      background-color: #e0e0e0;
    }
  </style>
</head>

<body>

  <button>버튼 1</button>
  <button>버튼 2</button>

</body>

</html>
